rule_data:
  trusted_task_rules:
    allow:
      konflux-defaults-deprecated:
        # These locations are deprecated and will be removed in the future. All
        # the task definitions published here are also available in
        # quay.io/konflux-ci/tekton-catalog, but we'll keep allowing these for
        # a while to give people some time to update their pipelines.
        # Tracked in https://redhat.atlassian.net/browse/EC-2074
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-*
        - pattern: oci://quay.io/konflux-ci/konflux-vanguard/*

        # Todo: This is used by just one team, so it would be better to define
        # a separate data source that can be referenced in registry-ose-osc-stage.yaml
        # and registry-ose-osc.yaml in the konflux-release-data repo in
        # config/stone-prd-rh01.pg1f.p1/product/EnterpriseContractPolicy
        # Tracked in https://redhat.atlassian.net/browse/EC-2073
        - pattern: oci://quay.io/konflux-ci/ose-osc-tenant/build-dm-verity-image-task

        # Todo: Similarly we're intending to move this matcher so it's only used for
        # the RoK builds, instead of everyone. Putting it here temporarily so RoK builds
        # continue to work after we cut over to the the new trusted task mechanism.
        # See also the following PRs. Once those PRs are merged this could be removed:
        # - https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline/-/merge_requests/348
        # - https://gitlab.cee.redhat.com/releng/konflux-release-data/-/merge_requests/21073
        # Tracked in https://redhat.atlassian.net/browse/EC-2072
        - pattern: git+https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline.git//task/*

    deny:
      konflux-defaults-deprecated:
        #-------------------------------------
        # konflux-ci/integration-service-catalog
        #-------------------------------------

        # clair-scan
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-clair-scan
          versions: ['<0.2']
          effective_on: "2026-09-05T00:00:00Z"

        # clamav-scan
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-clamav-scan
          versions: ['<0.2']
          effective_on: "2026-09-05T00:00:00Z"

        # deprecated-image-check
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-deprecated-image-check
          versions: ['<0.4']
          effective_on: "2026-08-06T00:00:00Z"
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-deprecated-image-check
          versions: ['<0.5']
          effective_on: "2026-09-05T00:00:00Z"

        # fbc-fips-check
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-fbc-fips-check
          versions: ['<0.1']

        # fbc-target-index-pruning-check
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-fbc-target-index-pruning-check
          versions: ['<0.1']

        # fips-operator-bundle-check
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-fips-operator-bundle-check
          versions: ['<0.1']

        # sbom-json-check
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-sbom-json-check
          versions: ['<0.2']
          effective_on: "2026-09-05T00:00:00Z"

        # validate-fbc
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-validate-fbc
          versions: ['<0.1']

        #-------------------------------------
        # konflux-ci/konflux-vanguard
        #-------------------------------------

        # rpms-signature-scan
        - pattern: oci://quay.io/konflux-ci/konflux-vanguard/task-rpms-signature-scan
          versions: ['<0.1']

        #-------------------------------------
        # konflux-ci/ose-osc-tenant
        #-------------------------------------

        # build-dm-verity-image
        - pattern: oci://quay.io/konflux-ci/ose-osc-tenant/build-dm-verity-image-task
          versions: ['<0.1']
